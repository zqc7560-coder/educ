# =====================================================================
# Nginx 生产站点配置（M12）—— 三大职责：SPA 静态托管 / /api 反代 / uploads 图片直出
# 挂载路径：容器内 /etc/nginx/conf.d/lf.conf（compose 只读挂载本目录）
# =====================================================================

# 静态资源指纹缓存：Vite 产物文件名带 hash，内容变则文件名变，可给 7 天长缓存；
# index.html 绝不能缓存，否则发版后旧 index 引用已删除的 hash 文件白屏。
map $sent_http_content_type $lf_cache_control {
    default            "public, max-age=604800";
    text/html          "no-cache";
    application/json   "no-store";
}

# upstream 连接池（博客 M16 压测抓出的真缺陷照搬到本项目预防）：
# 直写 proxy_pass 目标时每请求新建 TCP 连接，高并发下容器网段临时端口耗尽
# → errno 99 EADDRNOTAVAIL → 成片 502。keepalive 三件套（池容量 +
# proxy_http_version 1.1 + Connection ""）缺一不可。
upstream lf_api {
    server lf-server:8081;
    keepalive 64;
    keepalive_requests 100000;
    keepalive_timeout 300s;
}

server {
    listen 80;
    server_name _;

    # 上传闸门与后端对齐：后端 multipart max-file=5MB/max-request=6MB，
    # Nginx 卡 6m 让超限在入口 413，不打到 Java 再抛业务码。
    client_max_body_size 6m;

    access_log /var/log/nginx/lf-access.log;
    error_log  /var/log/nginx/lf-error.log warn;

    # ---------- /api → lf-server:8081 ----------
    location /api {
        proxy_pass http://lf_api;
        # $http_host 而非 $host：$host 会剥掉端口，后端自算 origin 变 http://localhost，
        # 与浏览器 Origin: http://localhost:8088 不等 → Spring 判跨域 → 未放行端口 403
        # Invalid CORS request（同源部署下"假跨域"必现，答辩实测）。保端口后真同源直过。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        add_header Cache-Control $lf_cache_control always;
    }

    # ---------- Knife4j 文档：生产默认不暴露（prod 已 springdoc 关，双保险） ----------
    # location ~ ^/(doc.html|webjars/|v3/api-docs) {
    #     proxy_pass http://lf_api;
    # }

    # ---------- 演示图片直出（bind 只读挂载，独立于 uploads 卷） ----------
    # 长前缀匹配优先于下方 location /uploads；down -v 重置卷后演示图仍在
    location /uploads/demoimg {
        alias /usr/share/nginx/demoimg;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- /uploads 图片直出（共享卷，后端写、Nginx 读） ----------
    location /uploads {
        alias /usr/share/nginx/uploads;
        # 上传文件名 uuid 重命名：内容不可变，30 天强缓存安全
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # ---------- SPA 入口兜底（Vue Router history 模式刷新不 404） ----------
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $lf_cache_control always;
    }
}
