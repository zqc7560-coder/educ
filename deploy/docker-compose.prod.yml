# =====================================================================
# 生产加固 override（M12）：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# 只写"与演示基线的差异"——override 做加法不做替换，一眼看清生产多了什么
# （资源护栏、重启策略、日志上限）。蓝本=博客毕设同名文件（M13 定稿）。
# =====================================================================

services:
  mysql:
    # 生产不暴露 3306（基线本就仅内部网络可达）；演示机 2C4G 顶格 1G 防挤压 JVM
    deploy:
      resources:
        limits:
          memory: 1g

  lf-server:
    restart: unless-stopped        # 演示基线不加：开发崩了要看现场；生产自动拉活
    deploy:
      resources:
        limits:
          memory: 768m             # JVM MaxRAMPercentage=75% → 堆约 576m，留 Metaspace/线程栈余量
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    deploy:
      resources:
        limits:
          memory: 320m             # maxmemory 256mb + AOF 缓冲余量

  nginx:
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
